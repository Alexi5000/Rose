[project]
name = "ai-companion"
version = "2.1.0"
description = "Rose - voice-first AI emotional support and reflective companion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "certifi>=2026.10.19",
    "elevenlabs==2.73.1",
    "fastapi[standard]==0.143.3",
    "groq>=0.30.0,<1.0.0",
    "langchain-groq==1.1.3",
    "pydantic==2.14.1",
    "langgraph==1.2.16",
    "langchain-openai==1.7.2",
    "pydantic-settings==2.16.0",
    "pre-commit==4.7.0",
    "langgraph-checkpoint-sqlite==3.1.2",
    "aiosqlite==0.22.1",
    "qdrant-client==1.19.1",
    "sentence-transformers==6.1.0",
    "python-multipart==0.0.32",
    "apscheduler==3.11.3",
    "slowapi==0.1.9",
    "structlog==26.1.0",
    "psutil==7.2.2",
    "sentry-sdk[fastapi]==2.72.0",
]

[project.optional-dependencies]
# Testing dependencies
test = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.17.0",
    "pytest-cov>=6,<8",
    "locust==2.46.7",
    "mypy==1.13.0",
    "ruff>=0.15.20",
]
# Browser automation testing (optional)
playwright = [
    "playwright==1.64.0",
    "pytest-playwright==0.10.0",
]
# Optional low-latency streaming STT provider.
streaming-stt = [
    "deepgram-sdk>=4.7.0,<7.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
force-exclude = true
extend-exclude = ["scripts/archive"]

[tool.ruff.lint]
# E: pycodestyle errors
# F: pyflakes
# W: pycodestyle warnings
# Q: flake8-quotes
# I: isort
# ASYNC: flake8-async (async/await pattern checks)
select = ["E", "F", "W", "Q", "I", "ASYNC"]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
check_untyped_defs = true
strict_equality = false
show_error_codes = true
show_column_numbers = true
pretty = true
# Allow some flexibility for gradual typing
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "dict-item",
    "misc",
    "no-redef",
    "no-untyped-def",
    "operator",
    "return-value",
    "union-attr",
]

# Exclude patterns
exclude = [
    "^tests/",
    "^notebooks/",
    "^scripts/",
    "^\\.venv/",
    "^build/",
    "^dist/",
]

# Per-module options for third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "elevenlabs.*",
    "groq.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_groq.*",
    "langchain_community.*",
    "langchain_openai.*",
    "langgraph.*",
    "qdrant_client.*",
    "sentence_transformers.*",
    "apscheduler.*",
    "slowapi.*",
    "structlog.*",
    "sentry_sdk.*",
    "aiofiles.*",
    "psutil.*",
]
ignore_missing_imports = true
