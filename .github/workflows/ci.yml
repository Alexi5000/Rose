name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test --extra streaming-stt

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Mypy
        run: uv run mypy src/

      - name: Unit and smoke tests
        env:
          ENVIRONMENT: ci
          LOG_LEVEL: WARNING
          LOG_SENSITIVE_CONTENT: "false"
          BACKUP_DIR: ${{ github.workspace }}/data/backups
          SHORT_TERM_MEMORY_DB_PATH: ${{ github.workspace }}/data/memory.db
        run: |
          mkdir -p data/backups
          uv run pytest tests/unit tests/test_deployment.py tests/test_smoke.py \
            -m "not slow and not integration" \
            --cov=src \
            --cov-report=term \
            --cov-fail-under=70

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
